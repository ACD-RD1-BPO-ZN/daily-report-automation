name: Daily Game Dev Report Automation

on:
  schedule:
    - cron: '50 23 * * *' # Every day at 23:50 UTC (07:50 CST next day)
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI
    inputs:
      test_mode:
        description: 'Run in test mode (Disables AI image generation)'
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-and-send-report:
    runs-on: ubuntu-latest
    
    # 👇 --- 變動 1：賦予 Actions 寫入（Push）程式碼的權限 --- 👇
    permissions:
      contents: write
    # 👆 -------------------------------------------------- 👆

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 👇 --- Cache Playwright 瀏覽器，避免每次重新下載 ~130MB 的 Chromium --- 👇
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

    - name: Install Playwright browsers and OS dependencies
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: |
        playwright install --with-deps chromium

    - name: Install Playwright OS dependencies only (cache hit)
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: |
        playwright install-deps chromium
    # 👆 ----------------------------------------------------------------- 👆

    - name: Run Report Automation
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}    
        PODCAST_WEBHOOK_URL: ${{ secrets.PODCAST_WEBHOOK_URL }}    
        FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        TEST_MODE: ${{ inputs.test_mode }}
      run: |
        echo "Starting daily report generation..."
        python generate_report.py
        
        echo "Fetching images..."
        python fetch_images_v2.py
        
        echo "Sending Report to Discord..."
        python discord_webhook_sender.py

        echo "Generating Podcast Audio..."
        python generate_podcast.py

        echo "Sending Podcast to Discord..."
        python discord_podcast_sender.py

        # 👇 執行臉書同步發文
        #echo "Syncing Headline to Facebook..."
        #python facebook_poster.py

    # 👇 --- 變動 2：將新產生的 JSON 記憶檔案 Commit 回 Repo --- 👇
    - name: Commit and push run history
      run: |
        # 1. 設定 Git 機器人的身分 (讓 GitHub 知道是這個腳本提交的)
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # 2. 告訴 Git 我們要追蹤這個記錄了 3 天頭條的 JSON 檔案與當日的 Markdown 報告
        # (加 || true 是為了防止檔案萬一因為爬蟲失敗沒產生時，整個 Action 中斷報錯)
        git add headline_history.json || true
        git add Daily_Report/ || true
        
        # 3. 提交變更。[skip ci] 非常重要，它能防止這次的 Push 再次觸發 Action 導致無限迴圈
        # (加 || echo... 是防止如果今天抓取的頭條跟昨天完全一樣，Git 發現沒東西可更新時報錯)
        git commit -m "chore: save daily report and history [skip ci]" || echo "No changes to commit"
        
        # 4. 推送回你的 GitHub 儲存庫
        git push
    # 👆 ------------------------------------------------------ 👆