name: Daily Game Dev Report Automation

on:
  schedule:
    - cron: '50 23 * * *' # Every day at 23:50 UTC (07:50 CST next day)
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-and-send-report:
    runs-on: ubuntu-latest
    
    # 👇 --- 變動 1：賦予 Actions 寫入（Push）程式碼的權限 --- 👇
    permissions:
      contents: write
    # 👆 -------------------------------------------------- 👆

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright browsers and OS dependencies
      run: |
        playwright install --with-deps chromium

    - name: Run Report Automation
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        UB_TOKEN: ${{ secrets.UB_TOKEN }}
        GUILD_ID: ${{ secrets.GUILD_ID }}
        TARGET_CHANNEL_ID: ${{ secrets.TARGET_CHANNEL_ID }}
        TEST_CHANNEL_ID: ${{ secrets.TEST_CHANNEL_ID }}
        DISCORD_FORUM_CHANNEL_ID: ${{ secrets.DISCORD_FORUM_CHANNEL_ID }}
        FORUM_TAG_HEADLINE_ID: ${{ secrets.FORUM_TAG_HEADLINE_ID }}
        FORUM_TAG_INDIE_ID: ${{ secrets.FORUM_TAG_INDIE_ID }}
        FORUM_TAG_GLOBAL_ID: ${{ secrets.FORUM_TAG_GLOBAL_ID }}
        FORUM_TAG_AI_ID: ${{ secrets.FORUM_TAG_AI_ID }}
        FORUM_TAG_UE_ID: ${{ secrets.FORUM_TAG_UE_ID }}
        FORUM_TAG_UNITY_ID: ${{ secrets.FORUM_TAG_UNITY_ID }}
        FORUM_TAG_TA_ID: ${{ secrets.FORUM_TAG_TA_ID }}
        FORUM_TAG_3D_ID: ${{ secrets.FORUM_TAG_3D_ID }}
      run: |
        echo "Starting daily report generation..."
        python generate_report.py
        
        echo "Fetching images..."
        python fetch_images_v2.py
        
        echo "Sending to Discord (Webhook)..."
        python discord_webhook_sender.py

        echo "Sending to Discord (Forum Channel)..."
        python discord_forum/discord_forum_sender.py

        echo "Sending Weekly Leaderboard (if Monday)..."
        python discord_bot/main.py --auto-weekly

    # 👇 --- 變動 2：將新產生的 JSON 記憶檔案 Commit 回 Repo --- 👇
    - name: Commit and push run history
      run: |
        # 1. 設定 Git 機器人的身分 (讓 GitHub 知道是這個腳本提交的)
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # 2. 追蹤產出的檔案（頭條歷史 + 報告 + 圖片目標 + 素材圖片）
        git add headline_history.json || true
        git add daily_targets.json || true
        git add Daily_Report/ || true
        git add assets/ || true
        
        # 3. 提交變更。[skip ci] 非常重要，它能防止這次的 Push 再次觸發 Action 導致無限迴圈
        # (加 || echo... 是防止如果今天抓取的頭條跟昨天完全一樣，Git 發現沒東西可更新時報錯)
        git commit -m "chore: update daily report and assets [skip ci]" || echo "No changes to commit"
        
        # 4. 推送回你的 GitHub 儲存庫
        git push
    # 👆 ------------------------------------------------------ 👆